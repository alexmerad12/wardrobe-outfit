# Checks on every push to main and every pull request: types, lint and the
# unit tests (pure logic, no secrets needed). Vercel's build is the deploy
# gate; the endpoint and browser suites (Playwright) need the e2e account
# and run against a server, so they stay manual (see CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # onnxruntime-node's install script downloads the CUDA libraries on
      # Linux (hundreds of MB, no GPU here). Same setting as vercel.json.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The project stays on TypeScript 6 because typescript-eslint (inside
      # eslint-config-next) throws "typescript-eslint does not support TS
      # 7.0". The code is still checked with TypeScript 7's native compiler
      # on every push, so the switch is a version bump the day lint allows.
      - name: Type-check with TypeScript 7 (native compiler)
        run: npm run typecheck:ts7
      - run: npm run lint
      - run: npm run test:unit
